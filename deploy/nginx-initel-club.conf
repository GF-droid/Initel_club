# Initel Club —— Nginx 站点配置
#
# ============================ 放置位置 ============================
# Debian/Ubuntu：
#   sudo cp deploy/nginx-initel-club.conf /etc/nginx/sites-available/initel-club
#   sudo ln -s /etc/nginx/sites-available/initel-club /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#
# Alibaba Cloud Linux / CentOS（RHEL 系）：
#   sudo cp deploy/nginx-initel-club.conf /etc/nginx/conf.d/initel-club.conf
#
# ⚠️ RHEL 系必须额外做一步，否则浏览器会看到 Nginx 的欢迎页而不是本项目：
#    RHEL 的 /etc/nginx/nginx.conf 里自带一个 `listen 80 default_server;`
#    的 server 块（root 指向 /usr/share/nginx/html），而且它定义在
#    `include /etc/nginx/conf.d/*.conf;` 之前，所以它会优先接管 80 端口。
#    处理方式（二选一）：
#      1) 用编辑器把 /etc/nginx/nginx.conf 里那个 server { ... } 整块注释掉；
#      2) 或者把下面的 server_name 改成你的实际访问地址，例如
#         server_name 8.148.187.51;   —— Nginx 会优先选精确匹配的虚拟主机。
#    改完都要 sudo nginx -t 验证。
#
# 记得把 root 改成你的实际部署目录。
# ================================================================

server {
    listen 80;
    listen [::]:80;

    # 用 IP 访问时保持 _ 即可；已有域名就填域名。
    # 如果同时存在 RHEL 自带的默认站点，改成精确的 IP/域名可以优先命中本配置。
    server_name _;

    # ==== 前端静态产物 ====
    # 这里是 vite build 的输出目录，必须包含 index.html
    root /srv/initel-club/dist;
    index index.html;

    # SPA 必需。项目路由用的是 createWebHistory（history 模式），
    # 直接访问或刷新 /home/data2 这类子路径时，服务器上并不存在对应文件，
    # 必须回退到 index.html 交给前端路由处理。少了这行就会 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容哈希的资源可以长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ==== API 反向代理 ====
    # 注意：proxy_pass 结尾【不要】加斜杠。
    # 后端全局前缀就是 /api/v1，加了斜杠会把 /api/v1/health 改写成 /v1/health 而 404。
    location /api/ {
        proxy_pass http://127.0.0.1:15010;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 对话/报表会调用 DeepSeek，耗时可超过 Nginx 默认的 60 秒
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_connect_timeout  10s;
    }

    # Swagger 文档（可选，公网暴露会让人看到全部接口，建议只在内网或临时开启）
    # location /api/docs {
    #     allow 127.0.0.1;
    #     allow 192.168.0.0/16;
    #     deny all;
    #     proxy_pass http://127.0.0.1:15010;
    # }

    client_max_body_size 10m;   # Excel 批量入库是 JSON，给足余量
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;
}
